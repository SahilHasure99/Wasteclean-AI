server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wastewise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:WasteWiseAI2024SecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast512BitsLongForHS512Algorithm!!}
    expiration-ms: 86400000  # 24 hours
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    com.wastewise: DEBUG
    org.springframework.security: WARN
